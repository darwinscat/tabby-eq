# SPDX-License-Identifier: AGPL-3.0-or-later
# TabbyEQ release — cut on pushing a `v*` tag. Builds the four macOS formats in Release, gates on
# ctest + auval, SIGNS them with the family's Developer ID, notarizes and staples them, and publishes
# a GitHub Release with the zip attached.
#
# Runs on the SELF-HOSTED macOS runner (the same one OrbitCab releases from): the Developer ID certs
# and the notarytool keychain profile live in that machine's Keychain, so nothing secret travels
# through the workflow — only the identity NAMES (org secrets MACOS_APP_IDENTITY / KCH_PWD) and the
# profile name (org var NOTARY_PROFILE).
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write        # gh release create needs to write Releases

env:
  TABBYEQ_BUILDER: ci    # stamp TabbyVersion.h kBuilder as "ci"

jobs:
  release:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 300     # notarization is the long pole — Apple's queue, not our build
    steps:
      # Gate: only CLEAN vX.Y.Z tags may publish. The in-plugin update check treats every published
      # release as authoritative (its compare rule parses a numeric semver out of the tag), so a
      # suffixed tag (v1.2.3-rc1 etc.) must never become the /releases/latest answer.
      - name: Gate — the tag must be clean semver (vX.Y.Z)
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a clean vX.Y.Z release tag — refusing to publish. Use a plain vX.Y.Z tag (pre-release/suffixed tags are not supported by the in-plugin update check)."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                 # full history + tags so `git describe --tags` resolves the release tag

      # A hosted runner starts empty; THIS one does not. The workspace (and its build/ with a CMake
      # cache, fetched deps and object files) survives from the previous run — including a run of a
      # different commit, or of a build that died half-way. A release artefact is exactly the thing
      # that must not be assembled out of two different trees, so the tree is wiped first: it costs a
      # few minutes of rebuild and buys the guarantee that the zip came from this tag alone.
      - name: Wipe the previous run's build tree (self-hosted workspaces persist)
        run: rm -rf build dist

      - name: Configure (Release; all four formats; JUCE fetched)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test (core suites + adapter version stamp)
        run: ctest --test-dir build --output-on-failure

      # auval finds the AU because juce_add_plugin(COPY_PLUGIN_AFTER_BUILD TRUE) installs the .component
      # into ~/Library/Audio/Plug-Ins/Components at build time. TbEq/Dcat = PLUGIN_CODE / MANUFACTURER.
      - name: Validate the Audio Unit (auval)
        run: auval -v aufx TbEq Dcat

      # Sign → notarize → staple → zip. The order is forced by the tools: stapler writes the ticket
      # INTO each bundle, and it cannot write into a zip — so the zip that goes to Apple is a throwaway
      # transport, and the zip that ships is built afterwards from the stapled bundles.
      - name: Package, sign, notarize, staple
        env:
          APP_ID:  ${{ secrets.MACOS_APP_IDENTITY }}
          NOTARY:  ${{ vars.NOTARY_PROFILE }}
          KCH_PWD: ${{ secrets.KCH_PWD }}
        run: |
          set -euo pipefail

          # Let codesign use the signing keys without a GUI prompt — the runner has no interactive
          # login session, and an unnamed partition list makes codesign fail with
          # errSecInternalComponent. Unlocking and re-setting the list every run is idempotent.
          KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$KCH_PWD" "$KEYCHAIN"
          # The partition list is a PRECAUTION, not a requirement, and it is refused on some hosts
          # (SecKeychainItemSetAccessWithPassword) even when that same password just unlocked that same
          # keychain a line earlier — the key's ACL was written in another security session. Failing the
          # release on the precaution would be wrong: codesign right below is the real gate, and if the
          # ACL genuinely blocks it, it says so in a message naming exactly that.
          if ! security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCH_PWD" "$KEYCHAIN" >/dev/null 2>&1; then
            echo "::warning::set-key-partition-list refused the keychain password (the unlock above succeeded); continuing — codesign is the gate"
          fi
          ART="$(find build -type d -name 'TabbyEQ_artefacts' | head -1)"
          if [ -z "$ART" ]; then echo "::error::TabbyEQ_artefacts dir not found"; exit 1; fi
          echo "Artefacts root: $ART"
          STAGE="dist/TabbyEQ"
          mkdir -p "$STAGE"
          # Collect the four format bundles (VST3/AU/CLAP/Standalone) wherever the generator placed them.
          find "$ART" -maxdepth 3 \( \
              -name 'TabbyEQ.vst3' -o -name 'TabbyEQ.component' \
              -o -name 'TabbyEQ.clap' -o -name 'TabbyEQ.app' \) -print0 \
            | while IFS= read -r -d '' bundle; do
                echo "  + $bundle"
                cp -R "$bundle" "$STAGE/"
              done
          COUNT="$(find "$STAGE" -maxdepth 1 -mindepth 1 | wc -l | tr -d ' ')"
          echo "Staged $COUNT bundle(s)."
          if [ "$COUNT" -lt 4 ]; then
            echo "::error::expected 4 bundles (VST3/AU/CLAP/Standalone), found $COUNT"; exit 1
          fi
          # Sign the STAGED copies, not the build tree: the standalone already carries an ad-hoc
          # signature from the build's post-build step, and --force is what replaces it with the real
          # Developer ID one. The plug-ins run inside a host and need no entitlements of their own;
          # the standalone is its own process reading the audio INPUT device, so it gets exactly one.
          for b in "$STAGE/TabbyEQ.vst3" "$STAGE/TabbyEQ.component" "$STAGE/TabbyEQ.clap"; do
            echo "  signing $b"
            codesign --force --options runtime --timestamp --sign "$APP_ID" "$b"
            codesign --verify --strict --verbose=1 "$b"
          done
          codesign --force --options runtime --timestamp \
                   --entitlements installer/standalone.entitlements --sign "$APP_ID" "$STAGE/TabbyEQ.app"
          codesign --verify --strict --verbose=1 "$STAGE/TabbyEQ.app"

          # One submission carries all four bundles. Apple notarizes what is INSIDE the archive, so a
          # single throwaway zip is enough — the ticket comes back per bundle.
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" dist/_notarize.zip
          xcrun notarytool submit dist/_notarize.zip --keychain-profile "$NOTARY" --wait
          rm -f dist/_notarize.zip

          # Staple each bundle so it is trusted on a machine that is offline (and so Gatekeeper never
          # has to ask Apple at first launch), then prove it: a missing ticket fails `stapler validate`.
          for b in "$STAGE/TabbyEQ.vst3" "$STAGE/TabbyEQ.component" "$STAGE/TabbyEQ.clap" "$STAGE/TabbyEQ.app"; do
            xcrun stapler staple "$b"
            xcrun stapler validate "$b"
          done
          spctl -a -vvv -t exec "$STAGE/TabbyEQ.app" || true    # informational: what Gatekeeper will say

          ZIP="TabbyEQ-${GITHUB_REF_NAME}-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Built $ZIP"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" "${ZIP}" \
            --title "TabbyEQ ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Signed + notarized macOS build (VST3 · AU · CLAP · Standalone), universal arm64 + x86_64. Every bundle carries a stapled notarization ticket, so it opens without a Gatekeeper prompt."
